server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Scroll ile scrub edilen video byte-range istekleriyle çekiliyor.
  # nginx bunu varsayılan olarak destekler; kapatan bir ayar eklenmemeli.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hash'li varlıklar: uzun önbellek.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Medya: uzun önbellek ama immutable değil (dosya adları sabit).
  location ~* \.(mp4|jpg|jpeg|png|svg|webp|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html her zaman taze; yeni derleme anında görünsün.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
